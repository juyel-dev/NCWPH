<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.json">
  <title>NCWPH Identity</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui; background:#0f172a; color:#e2e8f0; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:1rem; }
    .card { background:#1e293b; border-radius:1rem; padding:1.5rem; margin:0.5rem; width:100%; max-width:420px; }
    .header { text-align:center; }
    video, canvas { width:100%; border-radius:0.5rem; background:#000; }
    button { background:#3b82f6; border:none; color:#fff; padding:0.75rem; border-radius:0.5rem; font-weight:bold; width:100%; margin-top:0.5rem; cursor:pointer; font-size:1rem; }
    button:disabled { background:#475569; cursor:not-allowed; }
    .hash { word-break:break-all; font-family:monospace; font-size:0.8rem; background:#0f172a; padding:0.5rem; border-radius:0.25rem; margin-top:0.5rem; }
    textarea { width:100%; background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:0.5rem; border-radius:0.25rem; font-family:monospace; font-size:0.8rem; resize:vertical; }
    .status { text-align:center; padding:0.5rem; font-size:0.9rem; }
    .error { color:#f87171; }
    .success { color:#4ade80; }
    .result { font-weight:bold; margin-top:0.5rem; }
  </style>
</head>
<body>
  <div class="card header">
    <svg width="48" height="48" viewBox="0 0 64 64" style="margin-bottom:0.5rem">
      <circle cx="32" cy="32" r="30" stroke="#3b82f6" stroke-width="2" fill="#1e293b"/>
      <path d="M20 32 L32 20 L44 32 L32 44 Z" stroke="#60a5fa" stroke-width="2" fill="none"/>
      <circle cx="32" cy="32" r="4" fill="#93c5fd"/>
    </svg>
    <h3>NCWPH Identity</h3>
    <p style="opacity:0.7;font-size:0.85rem">Neural-Context Wavelet-Phase Hash</p>
    <p id="engineStatus" class="status">Loading engine...</p>
  </div>

  <div class="card">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none"></canvas>
    <button id="captureBtn" disabled>📸 Capture & Hash</button>
    <div id="hashResult" class="hash" style="display:none"></div>
  </div>

  <div class="card">
    <h4 style="margin-bottom:0.5rem">Compare Hashes</h4>
    <input type="text" id="hash1" placeholder="Paste hash #1" style="width:100%;padding:0.5rem;margin-bottom:0.5rem;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:0.25rem;font-family:monospace;font-size:0.8rem">
    <input type="text" id="hash2" placeholder="Paste hash #2" style="width:100%;padding:0.5rem;margin-bottom:0.5rem;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:0.25rem;font-family:monospace;font-size:0.8rem">
    <button id="compareBtn">⚖️ Compare</button>
    <div id="compareResult" class="result"></div>
  </div>

  <script src="ncwph_engine.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
