name: Build & Deploy NCWPH to Pages

on:
  push:
    branches: [ main ]

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.47

      - name: Compile C++ to WASM
        run: |
          mkdir -p dist
          em++ ncwph_engine.cpp \
            -o dist/ncwph_engine.js \
            -s WASM=1 \
            -s MODULARIZE=1 \
            -s EXPORT_NAME="Module" \
            -s ALLOW_MEMORY_GROWTH=1 \
            -O3 \
            --bind \
            -s NO_EXIT_RUNTIME=1

      - name: Copy static assets to dist
        run: |
          cp index.html dist/
          cp app.js dist/
          cp sw.js dist/
          cp manifest.json dist/
          cp icon.svg dist/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          enable_jekyll: false
